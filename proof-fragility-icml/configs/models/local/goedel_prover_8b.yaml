# configs/models/goedel_prover_v2/8b.yaml with room for correction prompts: their 8192
# context cannot hold a failed 8k proof + error. Output stays 8192 for every attempt.
# Also an explicit memory cap (vLLM shares the card with the Lean workers' host-side buffers).
model: Goedel-LM/Goedel-Prover-V2-8B
api: vllm
temperature: 1.0
max_tokens: 8192
top_p: 0.95
max_model_len: 16384
read_cost: 0
write_cost: 0
n_gpus: 1
node: 1
base_output_template: qwen
effective_parameters: 8
gpu_memory_utilization: 0.85
