# openai/oss-20b-high_json served by local vLLM (no Together key). Same 81920
# output budget; 131072 is gpt-oss's native context and fits on an L40S.
model: openai/gpt-oss-20b
api: vllm
n_gpus: 1
max_model_len: 131072
gpu_memory_utilization: 0.85
max_tokens: 81920
read_cost: 0.05
write_cost: 0.2
temperature: 1.0
reasoning_effort: high
structured_output: json
system_prompt: |
  You are ChatGPT, a large language model trained by OpenAI.
tokenizer_kwargs:
  reasoning_effort: high
  model_identity: You are OpenAI GPT OSS.
base_output_template: "api"
effective_parameters: 3.6
